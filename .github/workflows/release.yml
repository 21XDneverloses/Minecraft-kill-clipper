name: Release

# Pushing a tag like v1.2.0, or running this workflow by hand with a tag name,
# builds the mod and publishes a GitHub release with the jar.
# Release notes come from docs/release-notes/<tag>.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.1.1
        required: true
        default: v1.1.1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Kill Clipper ${{ env.TAG }} (Minecraft 1.21.11, Java 21)
          body_path: docs/release-notes/${{ env.TAG }}.md
          files: |
            build/libs/killclipper-*.jar
            !build/libs/*-sources.jar
