name: Release

# Pushing a tag like v1.2.0 builds the mod and publishes a GitHub release with the jar.
# Release notes come from docs/release-notes/<tag>.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Kill Clipper ${{ github.ref_name }} (Minecraft 1.21.11, Java 21)
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            build/libs/killclipper-*.jar
            !build/libs/*-sources.jar
